name: Rust

on:
    push:
        branches: [main]
        paths-ignore:
            - ".gitignore"
            - ".git-blame-ignore-revs"
    pull_request:
        branches: [main]
        paths-ignore:
            - ".gitignore"
            - ".git-blame-ignore-revs"

env:
    CARGO_TERM_COLOR: always
    # expat-sys's bundled CMakeLists.txt declares a minimum CMake version that CMake 4 rejects.
    CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        env:
            RUSTFLAGS: "-Dwarnings"
            RUST_BACKTRACE: 1
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true

            - name: Install Linux dependencies
              run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

            - name: Install stable toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache the Cargo build files
              uses: Leafwing-Studios/cargo-cache@v2
              with:
                  cache-group: check
                  save-if: ${{ github.event_name != 'pull_request' }}

            - name: Cargo check
              run: cargo build --all-features --workspace

    test:
        name: Test
        runs-on: ${{ matrix.os }}
        env:
            RUST_BACKTRACE: 1
        needs: check
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                toolchain: [stable, beta, nightly]
                include:
                    - os: windows-latest
                      toolchain: stable
                    - os: macos-latest
                      toolchain: stable
        steps:
            - name: Checkout source code
              uses: actions/checkout@v7
              with:
                  submodules: true

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

            - name: Install ${{ matrix.toolchain }} toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ matrix.toolchain }}

            - name: Cache the Cargo build files
              if: github.event_name != 'pull_request'
              uses: Leafwing-Studios/cargo-cache@v2
              with:
                  cache-group: test-${{ matrix.os }}-${{ matrix.toolchain }}
                  save-if: ${{ github.event_name != 'pull_request' }}

            - name: Cargo test
              run: cargo test --all-features --workspace

    style:
        name: Check Style
        runs-on: ubuntu-latest
        needs: check
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true

            - name: Install Linux dependencies
              run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

            - name: Install stable toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache the Cargo build files
              uses: Leafwing-Studios/cargo-cache@v2
              with:
                  cache-group: check
                  save-if: ${{ github.event_name != 'pull_request' }}

            - name: Run cargo fmt
              run: cargo fmt --all -- --check

            - name: Run cargo clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    coverage:
        name: Report coverage
        runs-on: ubuntu-latest
        needs: [style, test]
        if: github.event_name != 'pull_request'
        container:
            image: xd009642/tarpaulin:develop-nightly
            options: --security-opt seccomp=unconfined

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install Linux dependencies
              run: apt-get update && apt-get install -y libfontconfig1-dev

            - name: Generate code coverage
              run: |
                  cargo +nightly tarpaulin --verbose --all-features --workspace --timeout 120 --out xml

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: true

    docs:
        name: Documentation and examples
        runs-on: ubuntu-latest
        needs: check
        if: github.event_name != 'pull_request'
        permissions:
            contents: write
        steps:
            - name: Checkout source code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install Linux dependencies
              run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

            - name: Install stable toolchain for the examples
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install nightly toolchain for the documentation
              uses: dtolnay/rust-toolchain@nightly

            - name: Cache the Cargo build files
              uses: Leafwing-Studios/cargo-cache@v2
              with:
                  cache-group: documentation

            - name: Build documentation
              run: cargo doc -Zunstable-options -Zrustdoc-scrape-examples --no-deps --all-features
              env:
                  RUSTDOCFLAGS: --cfg docsrs

            - name: Finalize documentation
              run: |
                  echo "<meta http-equiv=\"refresh\" content=\"0; url=bevy_doryen\">" > target/doc/index.html
                  mkdir deploy
                  mv target/doc deploy/
                  touch deploy/.nojekyll

            - name: Install trunk
              uses: taiki-e/install-action@v2
              with:
                  tool: trunk

            - name: Build examples
              working-directory: example_runner
              env:
                  RUSTUP_TOOLCHAIN: stable
              run: |
                  trunk build --release --public-url /bevy_doryen/examples/
                  ls -lh dist/*.wasm

            - name: Optimize examples WASM
              uses: NiklasEi/wasm-opt-action@v2
              with:
                  file: example_runner/dist/*.wasm
                  options: "--strip-debug -Oz"

            - name: Finalize examples
              run: |
                  ls -lh example_runner/dist/*.wasm
                  mv example_runner/dist deploy/examples

            - name: Upload as artifact
              uses: actions/upload-artifact@v7
              with:
                  name: Documentation and examples
                  path: deploy

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: deploy
